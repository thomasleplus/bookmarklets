---
name: Scorecards supply-chain security
on:
  push:
    branches:
      - main
      - "releases/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  scorecards:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to read the code
      actions: read
      # Required to read the code
      contents: read
      # Required to sign the SARIF file
      id-token: write
      # Required to upload the SARIF file to the security tab
      security-events: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecards-results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecards-results.sarif
