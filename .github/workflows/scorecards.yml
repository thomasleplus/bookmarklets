---
name: Scorecards supply-chain security
on:
  push:
    branches:
      - main
      - "releases/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  scorecards:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to read the code
      actions: read
      # Required to read the code
      contents: read
      # Required to sign the SARIF file
      id-token: write
      # Required to upload the SARIF file to the security tab
      security-events: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecards-results.sarif
          results_format: sarif
          publish_results: true
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecards-results.sarif
