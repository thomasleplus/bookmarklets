---
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: "OSV Scanner - PR"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

jobs:
  osv-scanner-pr:
    permissions:
      # Require writing security events to upload SARIF file to security tab
      security-events: write
      # Read commit contents
      contents: read
      # Actions read-only
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      fail-on-vuln: false
  check:
    runs-on: ubuntu-latest
    needs: osv-scanner-pr
    steps:
      # The results are read from the uploaded artifacts rather than from the
      # reusable workflow's job outputs: a large output passed to a step via
      # env (or inline) exceeds the kernel's per-string exec limit and the
      # runner fails to start bash with "Argument list too long".
      - name: Download OSV scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-json-results"
          merge-multiple: true
          path: ${{ runner.temp }}/osv
      - name: Check OSV scan results
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          # Fail if any vulnerability present in the new results is absent from
          # the old results (by id or alias), i.e. the PR introduces it, and
          # list each one with its severity and affected packages. A jq failure
          # (e.g. missing or malformed results) aborts the step via set -e
          # instead of being mistaken for "no new vulnerabilities".
          vulns="$(jq -r --slurpfile old "${RUNNER_TEMP}/osv/old-results.json" '
            ([ $old[0].results[]?.packages[]?.vulnerabilities[]?
               | .id, .aliases[]? ]
             | map({(.): true}) | add // {}) as $known
            | [ .results[]?
                | .source.path as $path
                | .packages[]?
                | .package as $package
                | .groups as $groups
                | .vulnerabilities[]?
                | select($known[.id] | not)
                | .id as $id
                | { id,
                    summary: (.summary // ""),
                    severity: ([ $groups[]?
                                 | select(any(.ids[]?; . == $id))
                                 | .max_severity // empty
                                 | select(. != "") ]
                               | first // "unknown"),
                    package: "\($package.ecosystem)/\($package.name)@\($package.version) in \($path)" } ]
            | group_by(.id)[]
            | (.[0] | "\(.id)\(if .summary != "" then ": \(.summary)" else "" end) (severity \(.severity))"),
              (.[] | "  \(.package)")
            ' "${RUNNER_TEMP}/osv/new-results.json")"
          if [ -n "${vulns}" ]; then
            >&2 echo "error: PR introduces one or more new vulnerabilities:"
            >&2 printf '%s\n' "${vulns}"
            exit 1
          fi
