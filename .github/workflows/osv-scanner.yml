---
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: "OSV Scanner"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  osv-scanner:
    permissions:
      # Required to upload the SARIF file to the security tab
      security-events: write
      # Required to read the code
      contents: read
      # Required to read the code
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    with:
      fail-on-vuln: false
  check:
    runs-on: ubuntu-latest
    needs: osv-scanner
    steps:
      # The results are read from the uploaded artifact rather than from the
      # reusable workflow's job outputs: a large output passed to a step via
      # env (or inline) exceeds the kernel's per-string exec limit and the
      # runner fails to start bash with "Argument list too long".
      - name: Download OSV scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OSV Scanner SARIF file
          path: ${{ runner.temp }}/osv
      - name: Check OSV scan results
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          sarif="${RUNNER_TEMP}/osv/results.sarif"
          # Each rule in the SARIF report is a vulnerability found by the scan,
          # with its worst numeric CVSS score in the security-severity property.
          # Count the medium or higher severity ones. A jq failure (e.g. missing
          # or malformed report) aborts the step via set -e instead of being
          # mistaken for "no vulnerabilities".
          count="$(jq '
            [ .runs[].tool.driver.rules[]?
              | .properties["security-severity"] // empty
              | tonumber
              | select(. >= 4.0) ]
            | length
            ' "${sarif}")"
          if [ "${count}" -eq 0 ]; then
            exit 0
          fi
          # Print the vulnerabilities in the SARIF report as a table like the
          # one from osv-scanner's reporter, with the columns the report gives
          # directly: each result is an affected package, with its name,
          # version, and source, and each rule gives the vulnerability's ids
          # and worst CVSS score.
          jq -r '
            def pad($w): . + ((" " * ($w - length)) // "");
            def rating:
              if . == null or . == 0 then "Unknown"
              elif . >= 9 then "Critical"
              elif . >= 7 then "High"
              elif . >= 4 then "Medium"
              else "Low" end;
            def form($n; $one; $many): if $n == 1 then $one else $many end;
            [ .runs[]
              | (.tool.driver.rules // [] | map({key: .id, value: .}) | from_entries) as $rules
              | .results[]?
              | $rules[.ruleId] as $rule
              | (.message.text | capture("^Package \u0027(?<name>.+)@(?<version>[^@\u0027]*)\u0027")) as $pkg
              | { ids: ($rule.deprecatedIds // [] | if length == 0 then [$rule.id] else . end),
                  cvss: ($rule.properties["security-severity"] // ""),
                  name: $pkg.name,
                  version: $pkg.version,
                  source: .locations[0].physicalLocation.artifactLocation.uri } ]
            | sort_by(.source, .name, .version, .ids[0])
            | . as $rows
            | ([ $rows[] | [.source, .name, .version] ] | unique | length) as $packages
            | ([ $rows[] | .cvss | if . == "" then null else tonumber end | rating ]
               | group_by(.) | map({key: .[0], value: length}) | from_entries) as $ratings
            | [ ["OSV URL", "CVSS", "PACKAGE", "VERSION", "SOURCE"] ]
              + [ $rows[] | [ (.ids | map("https://osv.dev/" + .) | join("\n")),
                              .cvss, .name, .version, .source ] ]
            | . as $table
            | [ range(5) as $c | [ $table[][$c] | split("\n")[] | length ] | max ] as $widths
            | ("+" + ([ $widths[] | "-" * (. + 2) ] | join("+")) + "+") as $border
            | def line($cells): "| " + ([ range(5) as $c | $cells[$c] | pad($widths[$c]) ] | join(" | ")) + " |";
              def row($cells):
                ([ $cells[] | split("\n") | length ] | max) as $height
                | range($height) as $i | line([ $cells[] | split("\n")[$i] // "" ]);
              "",
              "Total \($packages) \(form($packages; "package"; "packages")) affected by \($rows | length) known \(form($rows | length; "vulnerability"; "vulnerabilities")) (\($ratings.Critical // 0) Critical, \($ratings.High // 0) High, \($ratings.Medium // 0) Medium, \($ratings.Low // 0) Low, \($ratings.Unknown // 0) Unknown).",
              "",
              $border, row($table[0]), $border, ($table[1:][] | row(.)), $border
            ' "${sarif}"
          echo "::error::Found one or more vulnerabilities with a medium or higher severity (CVSS 4.0 or more); see the table above. For more details, such as ecosystems and fixed versions, see the 'Run osv-scanner-reporter' step of the 'osv-scanner / osv-scan' job in this run."
          exit 1
